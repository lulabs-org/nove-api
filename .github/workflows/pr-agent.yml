name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

permissions:
  issues: write
  pull-requests: write
  contents: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pr_agent_job:
    # 跳过 bot 事件，避免评论循环
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@v0.42.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ===== DeepSeek V4 Flash（OpenAI 兼容）=====
          # litellm 通过 openai/ 前缀走 OpenAI 兼容协议，api_base 指向 DeepSeek 端点
          OPENAI__API_BASE: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI__KEY: ${{ secrets.OPENAI_API_KEY }}
          # secrets.OPENAI_MODEL 值应为 deepseek-v4-flash
          config.model: "openai/${{ secrets.OPENAI_MODEL }}"
          config.fallback_models: '["openai/${{ secrets.OPENAI_MODEL }}"]'
          # deepseek-v4-flash 不在 PR-Agent 内置 MAX_TOKENS 表，必须显式声明（原生 1M 上下文，128K 足够单次调用）
          config.custom_model_max_tokens: "128000"
          config.response_language: "zh-CN"
          pr_code_suggestions.num_code_suggestions: "6"
          # ===== 自动触发 describe + review + improve =====
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
